<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solus Code | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="login-container">
        <div class="login-card">
            <div class="logo">&lt;Solus/&gt;</div>
            <p class="subtitle">Conectando você aos melhores devs.</p>
            <h1 style="margin-bottom: 20px;">Área do Dev</h1>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="dev@nexuscode.com" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn-primary">ENTRAR NO SYSTEM</button>
            </form>

            <p class="register">
                Ainda não tem cadastro? <a href="#">Criar conta</a>
            </p>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
<!-- Link para o Manifest (necessário para a instalação PWA) -->
<link rel="manifest" href="manifest.json">

<!-- Ícone da aba do navegador (Favicon) -->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<!-- Ícone para dispositivos Apple (iOS) -->
<link rel="apple-touch-icon" href="icons/icon-192.png">
