<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Perfil | Solus Code</title>
</head>
<body>
    <header class="topbar">
        <a href="index.html" class="logo">&lt;Solus/&gt;</a>
        <nav>
            <a href="index.html">Início</a>
            <a href="servicos.html">Devs</a>
            <a href="perfil.html">Perfil</a>
        </nav>
    </header>

    <main class="home">
        <section class="login-card">
            <h1>Perfil do Desenvolvedor</h1>
            <br>
            <p style="color: #9ca3af;">Usuário autenticado:</p>
            <h2 id="usuario" style="color: #22d3ee; margin: 10px 0 25px;">Carregando...</h2>

            <button class="btn-primary" onclick="logout()">LOGOUT</button>
        </section>
    </main>

    <script>
        const usuario = localStorage.getItem("usuario");
        document.getElementById("usuario").textContent = usuario || "Desenvolvedor Anônimo";

        function logout() {
            localStorage.removeItem("usuario");
            window.location.href = "login.html";
        }
    </script>
    <script src="js/script.js"></script>
</body>
</html>
